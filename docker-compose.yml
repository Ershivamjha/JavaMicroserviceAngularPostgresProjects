services:
  catalog-db:
    image: postgres:16-alpine
    environment: {POSTGRES_DB: catalog, POSTGRES_USER: catalog_user, POSTGRES_PASSWORD: catalog_password}
    healthcheck: {test: ["CMD-SHELL", "pg_isready -U catalog_user -d catalog"], interval: 5s, timeout: 3s, retries: 10}
  orders-db:
    image: postgres:16-alpine
    environment: {POSTGRES_DB: orders, POSTGRES_USER: orders_user, POSTGRES_PASSWORD: orders_password}
    healthcheck: {test: ["CMD-SHELL", "pg_isready -U orders_user -d orders"], interval: 5s, timeout: 3s, retries: 10}
  catalog-service:
    build: ./catalog-service
    environment: {SPRING_DATASOURCE_URL: jdbc:postgresql://catalog-db:5432/catalog, SPRING_DATASOURCE_USERNAME: catalog_user, SPRING_DATASOURCE_PASSWORD: catalog_password}
    ports: ["8081:8081"]
    depends_on: {catalog-db: {condition: service_healthy}}
  order-service:
    build: ./order-service
    environment: {SPRING_DATASOURCE_URL: jdbc:postgresql://orders-db:5432/orders, SPRING_DATASOURCE_USERNAME: orders_user, SPRING_DATASOURCE_PASSWORD: orders_password, CATALOG_URL: http://catalog-service:8081}
    ports: ["8082:8082"]
    depends_on: {orders-db: {condition: service_healthy}, catalog-service: {condition: service_started}}
  api-gateway:
    build: ./api-gateway
    ports: ["8080:8080"]
    depends_on: [catalog-service, order-service]
  frontend:
    build: ./frontend
    ports: ["4200:80"]
    depends_on: [api-gateway]
